[package]
name = "goniec"
version = "0.1.0"
edition = "2024"
description = "Carries chat messages between a user and AI agent sessions, over Zulip"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
toml = "1.1.8"
